<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Pong</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
html, body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  background: radial-gradient(circle at center, #111 0%, #050510 70%);
}

#smashBtn{
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 50px;
  border: none;
  border-radius: 25px;
  background: rgba(255,255,255,0.12);
  color: white;
  font-weight: bold;
  font-size: 16px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 15px #ff00ff;
  z-index: 10;
  cursor: pointer;
  user-select: none;
}

#smashBtn:active{
  transform: translateX(-50%) scale(0.95);
}

#settingsBtn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  color: white;
  font-size: 24px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 15px #00e5ff;
  z-index: 20;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  padding: 0;
}

#settingsBtn img {
  width: 30px;
  height: 30px;
  object-fit: contain;
}

#settingsBtn:hover {
  box-shadow: 0 0 25px #00e5ff;
  background: rgba(0, 229, 255, 0.2);
}

#settingsBtn:active {
  transform: scale(0.9);
}

#settingsMenu {
  position: fixed;
  bottom: 80px;
  left: 20px;
  background: rgba(5, 5, 16, 0.95);
  border: 2px solid #00e5ff;
  border-radius: 15px;
  padding: 25px;
  width: 300px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
  z-index: 25;
  display: none;
  font-family: Arial, sans-serif;
}

#settingsMenu.open {
  display: block;
}

.settings-title {
  color: #00e5ff;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
  text-shadow: 0 0 10px #00e5ff;
}

.settings-item {
  margin-bottom: 20px;
  color: white;
}

.settings-label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: #cccccc;
}

.settings-select,
.settings-checkbox {
  width: 100%;
  padding: 8px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid #00e5ff;
  border-radius: 5px;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

.settings-select:hover,
.settings-checkbox:hover {
  background: rgba(0, 229, 255, 0.2);
}

.checkbox-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
}

.settings-checkbox {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

#closeSettingsBtn {
  width: 100%;
  padding: 10px;
  margin-top: 15px;
  background: rgba(255, 0, 255, 0.2);
  border: 1px solid #ff00ff;
  border-radius: 5px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

#closeSettingsBtn:hover {
  background: rgba(255, 0, 255, 0.4);
  box-shadow: 0 0 15px #ff00ff;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<button id="settingsBtn"><img src="settingsicon.png" alt="Settings"></button>
<div id="settingsMenu">
  <div class="settings-title" id="settingsTitle">SETTINGS</div>
  
  <div class="settings-item">
    <label class="settings-label" id="difficultyLabel">Difficulty:</label>
    <select id="difficultySelect" class="settings-select">
      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <div class="settings-item">
    <label class="settings-label" id="languageLabel">Language:</label>
    <select id="languageSelect" class="settings-select">
      <option value="en">English</option>
      <option value="fr">French</option>
      <option value="es">Spanish</option>
    </select>
  </div>

  <button id="closeSettingsBtn" style="font-size: 14px;">CLOSE</button>
</div>

<button id="smashBtn">SMASH</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const smashBtn = document.getElementById("smashBtn");
const settingsBtn = document.getElementById("settingsBtn");
const settingsMenu = document.getElementById("settingsMenu");
const closeSettingsBtn = document.getElementById("closeSettingsBtn");
const difficultySelect = document.getElementById("difficultySelect");
const languageSelect = document.getElementById("languageSelect");
const settingsTitle = document.getElementById("settingsTitle");
const difficultyLabel = document.getElementById("difficultyLabel");
const languageLabel = document.getElementById("languageLabel");

let gameState = "menu";
const WIN_SCORE = 5;

let winner = "";
let pulse = 0;
let shake = 0;

let smashActive = false;
let smashTimer = 0;

let botSmashActive = false;
let botSmashCooldown = 0;

// Game settings
let gameSettings = {
  difficulty: "normal",
  language: "en"
};

// Language translations
const translations = {
  en: {
    menuTitle: "NEON PONG",
    menuInstructions: "CLICK: START • E OR BUTTON: SMASH",
    playerWon: "PLAYER WINS",
    botWon: "BOT WINS",
    restartInstructions: "CLICK / TOUCH / SPACE TO RESTART",
    settings: "SETTINGS",
    difficulty: "Difficulty:",
    language: "Language:",
    close: "CLOSE"
  },
  fr: {
    menuTitle: "NEON PONG",
    menuInstructions: "CLIQUE: COMMENCER ∙ E OU BOUTON : SMASH",
    playerWon: "JOUEUR GAGNE",
    botWon: "BOT GAGNE",
    restartInstructions: "CLIQUE / TOUCHE / ESPACE POUR RECOMMENCER",
    settings: "PARAMÈTRES",
    difficulty: "Difficulté:",
    language: "Langue:",
    close: "FERMER"
  },
  es: {
    menuTitle: "NEON PONG",
    menuInstructions: "CLIC: COMENZAR • E O BOTÓN: GOLPE",
    playerWon: "JUGADOR GANA",
    botWon: "BOT GANA",
    restartInstructions: "CLIC / TOQUE / ESPACIO PARA REINICIAR",
    settings: "CONFIGURACIÓN",
    difficulty: "Dificultad:",
    language: "Idioma:",
    close: "CERRAR"
  }
};

function getTranslation(key) {
  return translations[gameSettings.language][key];
}

function updateSettingsUI() {
  settingsTitle.textContent = getTranslation("settings");
  difficultyLabel.textContent = getTranslation("difficulty");
  languageLabel.textContent = getTranslation("language");
  closeSettingsBtn.textContent = getTranslation("close");
}

const player = {
  x: 20,
  y: 200,
  w: 12,
  h: 120,
  score: 0
};

const bot = {
  x: 0,
  y: 200,
  w: 12,
  h: 120,
  score: 0
};

const ball = {
  x: 0,
  y: 0,
  r: 10,
  vx: 7,
  vy: 4
};

const particles = [];
const trail = [];
const stars = [];

for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    size: Math.random() * 2
  });
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  bot.x = canvas.width - 40;
}

window.addEventListener("resize", resize);

  window.addEventListener("mousemove", e => {
  player.y = e.clientY - player.h / 2;
  // Clamp player paddle to canvas bounds
  player.y = Math.max(0, Math.min(player.y, canvas.height - player.h));
});

window.addEventListener("touchmove", e => {
  player.y = e.touches[0].clientY - player.h / 2;
  // Clamp player paddle to canvas bounds
  player.y = Math.max(0, Math.min(player.y, canvas.height - player.h));
}, { passive: true });

window.addEventListener("keydown", e => {

  if (e.code === "KeyE" && gameState === "playing") {
    smashActive = true;
    smashTimer = 15;
  }

  if (e.code === "Space") {

    e.preventDefault();

    if (gameState === "menu") {
      gameState = "playing";
    }

    else if (gameState === "gameover") {
      resetGame();
      gameState = "playing";
    }

  }

});

smashBtn.addEventListener("touchstart", e => {
  e.preventDefault();

  if (gameState === "playing") {
    smashActive = true;
    smashTimer = 15;
  }
});

smashBtn.addEventListener("mousedown", () => {
  if (gameState === "playing") {
    smashActive = true;
    smashTimer = 15;
  }
});

window.addEventListener("pointerdown", e => {

  if (e.target === smashBtn || e.target === settingsBtn || settingsMenu.contains(e.target)) return;

  if (gameState === "menu") {
    gameState = "playing";
  }

  else if (gameState === "gameover") {
    resetGame();
    gameState = "playing";
  }

});

// Settings menu handlers
settingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  settingsMenu.classList.toggle("open");
});

closeSettingsBtn.addEventListener("click", () => {
  settingsMenu.classList.remove("open");
});

difficultySelect.addEventListener("change", (e) => {
  gameSettings.difficulty = e.target.value;
  applyDifficultySettings();
});

languageSelect.addEventListener("change", (e) => {
  gameSettings.language = e.target.value;
  updateSettingsUI();
});

// Close settings menu when clicking outside
document.addEventListener("click", (e) => {
  if (e.target !== settingsBtn && e.target !== settingsMenu && !settingsMenu.contains(e.target)) {
    settingsMenu.classList.remove("open");
  }
});

function applyDifficultySettings() {
  switch(gameSettings.difficulty) {
    case "easy":
      // Bot AI disabled - cannot smash
      break;
    case "normal":
      // Default settings - moderate smashing
      break;
    case "hard":
      // Bot AI aggressive - frequent smashing
      break;
  }
}

function resetGame() {
  player.score = 0;
  bot.score = 0;
  winner = "";
  particles.length = 0;
  trail.length = 0;
  resetBall();
}

function resetBall() {

  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;

  ball.vx = Math.random() > 0.5 ? 7 : -7;
  ball.vy = (Math.random() - 0.5) * 6;

  smashActive = false;
  botSmashActive = false;

  trail.length = 0;
}

function collision(ball, paddle) {
  return (
    ball.x - ball.r < paddle.x + paddle.w &&
    ball.x + ball.r > paddle.x &&
    ball.y - ball.r < paddle.y + paddle.h &&
    ball.y + ball.r > paddle.y
  );
}

function lineIntersectsRect(x1, y1, x2, y2, rect) {
  // Check if a line segment from (x1,y1) to (x2,y2) intersects with a rectangle
  const rectLeft = rect.x;
  const rectRight = rect.x + rect.w;
  const rectTop = rect.y;
  const rectBottom = rect.y + rect.h;

  // Check if either endpoint is inside the rect
  if ((x1 >= rectLeft && x1 <= rectRight && y1 >= rectTop && y1 <= rectBottom) ||
      (x2 >= rectLeft && x2 <= rectRight && y2 >= rectTop && y2 <= rectBottom)) {
    return true;
  }

  // Check intersection with rect edges
  const dx = x2 - x1;
  const dy = y2 - y1;

  // Left and right edges
  if (dx !== 0) {
    const tLeft = (rectLeft - x1) / dx;
    const tRight = (rectRight - x1) / dx;
    
    for (let t of [tLeft, tRight]) {
      if (t >= 0 && t <= 1) {
        const yAtT = y1 + t * dy;
        if (yAtT >= rectTop && yAtT <= rectBottom) {
          return true;
        }
      }
    }
  }

  // Top and bottom edges
  if (dy !== 0) {
    const tTop = (rectTop - y1) / dy;
    const tBottom = (rectBottom - y1) / dy;
    
    for (let t of [tTop, tBottom]) {
      if (t >= 0 && t <= 1) {
        const xAtT = x1 + t * dx;
        if (xAtT >= rectLeft && xAtT <= rectRight) {
          return true;
        }
      }
    }
  }

  return false;
}

function createExplosion(x, y, color) {

  for (let i = 0; i < 18; i++) {

    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 1,
      color
    });

  }

}

  function updateParticles() {

  for (let i = particles.length - 1; i >= 0; i--) {

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.life -= 0.03;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }

  }

}

function drawParticles() {

  particles.forEach(p => {

    ctx.save();

    ctx.globalAlpha = p.life * 0.6;

    ctx.fillStyle = p.color;

    ctx.shadowBlur = 15;
    ctx.shadowColor = p.color;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

  });

}

function drawPaddle(paddle, color) {

  ctx.save();

  ctx.fillStyle = color;

  ctx.shadowBlur = 25;
  ctx.shadowColor = color;

  ctx.fillRect(
    paddle.x,
    paddle.y,
    paddle.w,
    paddle.h
  );

  ctx.restore();

}

function drawBall() {

  ctx.save();

  ctx.fillStyle = "#00e5ff";

  ctx.shadowBlur = 25;
  ctx.shadowColor = "#00e5ff";

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

}

function drawTrail() {

  trail.forEach((t, i) => {

    ctx.save();

    ctx.globalAlpha = (i / trail.length) * 0.18;

    ctx.fillStyle = "#00e5ff";

    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * 0.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

  });

}

function drawCenterLine() {

  ctx.strokeStyle = "rgba(255,255,255,0.1)";

  ctx.setLineDash([10, 15]);

  ctx.beginPath();

  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);

  ctx.stroke();

}

function drawStars() {

  stars.forEach(star => {

    ctx.fillStyle = "rgba(255,255,255,0.15)";

    ctx.beginPath();

        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);

    ctx.fill();

  });

}

function drawMenuScreen() {

  pulse += 0.05;

  ctx.fillStyle = "#050510";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawStars();

  ctx.save();

  ctx.textAlign = "center";

  ctx.shadowBlur = 30 + Math.sin(pulse) * 10;
  ctx.shadowColor = "#00e5ff";

  ctx.fillStyle = "#00e5ff";

  ctx.font = "bold 90px Arial";

  ctx.fillText(
    getTranslation("menuTitle"),
    canvas.width / 2,
    canvas.height / 2 - 60
  );

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "28px Arial";

  ctx.fillText(
    getTranslation("menuInstructions"),
    canvas.width / 2,
    canvas.height / 2 + 40
  );

}

function drawEndScreen() {

  ctx.fillStyle = "#050510";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawStars();

  ctx.save();

  ctx.textAlign = "center";

  ctx.fillStyle =
    winner === getTranslation("playerWon")
      ? "#00ff99"
      : "#ff0044";

  ctx.shadowBlur = 35;
  ctx.shadowColor = ctx.fillStyle;

  ctx.font = "bold 90px Arial";

  ctx.fillText(
    winner,
    canvas.width / 2,
    canvas.height / 2 - 80
  );

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "30px Arial";

  ctx.fillText(
    `${player.score} - ${bot.score}`,
    canvas.width / 2,
    canvas.height / 2
  );

  ctx.font = "24px Arial";

  ctx.fillText(
    getTranslation("restartInstructions"),
    canvas.width / 2,
    canvas.height / 2 + 80
  );

}

function update() {

  if (gameState !== "playing") return;

  if (smashActive) {
    smashTimer--;

    if (smashTimer <= 0) {
      smashActive = false;
    }
  }

  if (botSmashCooldown > 0) {
    botSmashCooldown--;
  }

  const prevBallX = ball.x;
  const prevBallY = ball.y;

  ball.x += ball.vx;
  ball.y += ball.vy;

  trail.push({

        x: ball.x,
    y: ball.y
  });

  if (trail.length > 10) {
    trail.shift();
  }

  if (
    ball.y < ball.r ||
    ball.y > canvas.height - ball.r
  ) {

    ball.vy *= -1;

    createExplosion(
      ball.x,
      ball.y,
      "#00e5ff"
    );

    shake = 7;

  }

  // Clamp ball Y to canvas bounds
  ball.y = Math.max(ball.r, Math.min(ball.y, canvas.height - ball.r));

  // Difficulty-based bot speed
  let botSpeed = 0.14;
  switch(gameSettings.difficulty) {
    case "easy":
      botSpeed = 0.08;
      break;
    case "normal":
      botSpeed = 0.14;
      break;
    case "hard":
      botSpeed = 0.18;
      break;
  }

  bot.y += (
    ball.y - (bot.y + bot.h / 2)
  ) * botSpeed;
  
  // Clamp bot paddle to canvas bounds
  bot.y = Math.max(0, Math.min(bot.y, canvas.height - bot.h));

  // Difficulty-based bot AI
  let botSmashChance = 0.015;
  switch(gameSettings.difficulty) {
    case "easy":
      botSmashChance = 0;
      break;
    case "normal":
      botSmashChance = 0.012;
      break;
    case "hard":
      botSmashChance = 0.025;
      break;
  }

  if (
    ball.vx > 0 &&
    ball.x > canvas.width * 0.72 &&
    botSmashCooldown <= 0 &&
    Math.random() < botSmashChance
  ) {
    botSmashActive = true;
  }

  // Player collision with continuous detection
  if (
    ball.vx < 0 &&
    (collision(ball, player) || lineIntersectsRect(prevBallX, prevBallY, ball.x, ball.y, player))
  ) {

    let hitPos =
      (ball.y - (player.y + player.h / 2))
      / (player.h / 2);

    if (smashActive) {

      ball.vx = Math.abs(ball.vx) + 8;
      ball.vy = hitPos * 14;

      createExplosion(
        ball.x,
        ball.y,
        "#ffffff"
      );

      createExplosion(
        ball.x,
        ball.y,
        "#ff00ff"
      );

      shake = 18;

      smashActive = false;

    } else {

      ball.vx = Math.abs(ball.vx) + 0.25;
      ball.vy = hitPos * 8;

      createExplosion(
        ball.x,
        ball.y,
        "#ff00ff"
      );

      shake = 9;

    }

    ball.x =
      player.x +
      player.w +
      ball.r;

  }

  // Bot collision with continuous detection
  if (
    ball.vx > 0 &&
    (collision(ball, bot) || lineIntersectsRect(prevBallX, prevBallY, ball.x, ball.y, bot))
  ) {

    let hitPos =
      (ball.y - (bot.y + bot.h / 2))
      / (bot.h / 2);

    if (botSmashActive) {

      ball.vx =
        -Math.abs(ball.vx) - 8;

      ball.vy =
        hitPos * 14;

      createExplosion(
        ball.x,
        ball.y,
        "#ffffff"
      );

            createExplosion(
        ball.x,
        ball.y,
        "#39ff14"
      );

      shake = 18;

      botSmashActive = false;
      botSmashCooldown = 240;

    } else {

      ball.vx =
        -Math.abs(ball.vx) - 0.25;

      ball.vy =
        hitPos * 8;

      createExplosion(
        ball.x,
        ball.y,
        "#39ff14"
      );

      shake = 9;

    }

    ball.x =
      bot.x -
      ball.r;

  }

  if (ball.x < 0) {
    bot.score++;
    resetBall();
  }

  if (ball.x > canvas.width) {
    player.score++;
    resetBall();
  }

  if (player.score >= WIN_SCORE) {
    winner = getTranslation("playerWon");
    gameState = "gameover";
  }

  if (bot.score >= WIN_SCORE) {
    winner = getTranslation("botWon");
    gameState = "gameover";
  }

  updateParticles();

  if (shake > 0) {
    shake--;
  }

}

function renderGame() {

  ctx.fillStyle = "#050510";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  let dx = 0;
  let dy = 0;

  if (shake > 0) {

    dx =
      (Math.random() - 0.5) * shake;

    dy =
      (Math.random() - 0.5) * shake;

  }

  ctx.save();

  ctx.translate(dx, dy);

  drawCenterLine();

  drawTrail();

  drawParticles();

  drawPaddle(
    player,
    smashActive
      ? "#ffffff"
      : "#ff00ff"
  );

  drawPaddle(
    bot,
    botSmashActive
      ? "#ffffff"
      : "#39ff14"
  );

  drawBall();

  ctx.fillStyle = "white";

  ctx.font = "48px Arial";

    ctx.fillText(
    player.score,
    canvas.width / 2 - 100,
    60
  );

  ctx.fillText(
    bot.score,
    canvas.width / 2 + 70,
    60
  );

  ctx.restore();

}

function render() {

  if (gameState === "menu") {
    drawMenuScreen();
    return;
  }

  if (gameState === "gameover") {
    drawEndScreen();
    return;
  }

  renderGame();

}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

resize();
updateSettingsUI();
gameLoop();
</script>
</body>
</html>

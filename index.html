<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Pong</title>

<style>
html, body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  background: radial-gradient(circle at center, #111 0%, #050510 70%);
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameState = "menu";
const WIN_SCORE = 5;

let winner = "";
let pulse = 0;
let shake = 0;

let smashActive = false;
let smashTimer = 0;

let botSmashActive = false;
let botSmashCooldown = 0;

const player = {
  x: 20,
  y: 200,
  w: 12,
  h: 120,
  score: 0
};

const bot = {
  x: 0,
  y: 200,
  w: 12,
  h: 120,
  score: 0
};

const ball = {
  x: 0,
  y: 0,
  r: 10,
  vx: 7,
  vy: 4
};

const particles = [];
const trail = [];
const stars = [];

for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    size: Math.random() * 2
  });
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  bot.x = canvas.width - 40;
}

window.addEventListener("resize", resize);

window.addEventListener("mousemove", e => {
  player.y = e.clientY - player.h / 2;
});

window.addEventListener("keydown", e => {

  if (e.code === "KeyE" && gameState === "playing") {
    smashActive = true;
    smashTimer = 15;
  }

  if (e.code === "Space") {

    e.preventDefault();

    if (gameState === "menu") {
      gameState = "playing";
    }

    else if (gameState === "gameover") {
      resetGame();
      gameState = "playing";
    }

  }

});

function resetGame() {
  player.score = 0;
  bot.score = 0;
  winner = "";
  particles.length = 0;
  trail.length = 0;
  resetBall();
}

function resetBall() {

  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;

  ball.vx = Math.random() > 0.5 ? 7 : -7;
  ball.vy = (Math.random() - 0.5) * 6;

  smashActive = false;
  botSmashActive = false;

  trail.length = 0;
}

function collision(ball, paddle) {
  return (
    ball.x - ball.r < paddle.x + paddle.w &&
    ball.x + ball.r > paddle.x &&
    ball.y - ball.r < paddle.y + paddle.h &&
    ball.y + ball.r > paddle.y
  );
}

function createExplosion(x, y, color) {

  for (let i = 0; i < 18; i++) {

    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 1,
      color
    });

  }

}

function updateParticles() {

  for (let i = particles.length - 1; i >= 0; i--) {

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.life -= 0.03;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }

  }

}

function drawParticles() {

  particles.forEach(p => {

    ctx.save();

    ctx.globalAlpha = p.life * 0.6;

    ctx.fillStyle = p.color;

    ctx.shadowBlur = 15;
    ctx.shadowColor = p.color;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

  });

}

function drawPaddle(paddle, color) {

  ctx.save();

  ctx.fillStyle = color;

  ctx.shadowBlur = 25;
  ctx.shadowColor = color;

  ctx.fillRect(
    paddle.x,
    paddle.y,
    paddle.w,
    paddle.h
  );

  ctx.restore();

}

function drawBall() {

  ctx.save();

  ctx.fillStyle = "#00e5ff";

  ctx.shadowBlur = 25;
  ctx.shadowColor = "#00e5ff";

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

}

function drawTrail() {

  trail.forEach((t, i) => {

    ctx.save();

    ctx.globalAlpha = (i / trail.length) * 0.18;

    ctx.fillStyle = "#00e5ff";

    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * 0.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

  });

}

function drawCenterLine() {

  ctx.strokeStyle = "rgba(255,255,255,0.1)";

  ctx.setLineDash([10, 15]);

  ctx.beginPath();

  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);

  ctx.stroke();

}

function drawStars() {

  stars.forEach(star => {

    ctx.fillStyle = "rgba(255,255,255,0.15)";

    ctx.beginPath();

    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);

    ctx.fill();

  });

}

function drawMenuScreen() {

  pulse += 0.05;

  ctx.fillStyle = "#050510";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawStars();

  ctx.save();

  ctx.textAlign = "center";

  ctx.shadowBlur = 30 + Math.sin(pulse) * 10;
  ctx.shadowColor = "#00e5ff";

  ctx.fillStyle = "#00e5ff";

  ctx.font = "bold 90px Arial";

  ctx.fillText(
    "NEON PONG",
    canvas.width / 2,
    canvas.height / 2 - 60
  );

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "28px Arial";

  ctx.fillText(
    "SPACE TO START • E TO SMASH",
    canvas.width / 2,
    canvas.height / 2 + 40
  );

}

function drawEndScreen() {

  ctx.fillStyle = "#050510";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawStars();

  ctx.save();

  ctx.textAlign = "center";

  ctx.fillStyle =
    winner === "PLAYER WINS"
    ? "#00ff99"
    : "#ff0044";

  ctx.shadowBlur = 35;
  ctx.shadowColor = ctx.fillStyle;

  ctx.font = "bold 90px Arial";

  ctx.fillText(
    winner,
    canvas.width / 2,
    canvas.height / 2 - 80
  );

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "30px Arial";

  ctx.fillText(
    `${player.score} - ${bot.score}`,
    canvas.width / 2,
    canvas.height / 2
  );

  ctx.font = "24px Arial";

  ctx.fillText(
    "PRESS SPACE TO RESTART",
    canvas.width / 2,
    canvas.height / 2 + 80
  );

}

function update() {

  if (gameState !== "playing") return;

  if (smashActive) {
    smashTimer--;
    if (smashTimer <= 0) smashActive = false;
  }

  if (botSmashCooldown > 0) {
    botSmashCooldown--;
  }

  ball.x += ball.vx;
  ball.y += ball.vy;

  trail.push({
    x: ball.x,
    y: ball.y
  });

  if (trail.length > 10) {
    trail.shift();
  }

  if (
    ball.y < ball.r ||
    ball.y > canvas.height - ball.r
  ) {
    ball.vy *= -1;

    createExplosion(ball.x, ball.y, "#00e5ff");

    shake = 7;
  }

  bot.y += (
    ball.y - (bot.y + bot.h / 2)
  ) * 0.14;

  if (
    ball.vx > 0 &&
    ball.x > canvas.width * 0.72 &&
    botSmashCooldown <= 0 &&
    Math.random() < 0.015
  ) {
    botSmashActive = true;
  }

  if (
    collision(ball, player) &&
    ball.vx < 0
  ) {

    let hitPos =
      (ball.y - (player.y + player.h / 2))
      / (player.h / 2);

    if (smashActive) {

      ball.vx = Math.abs(ball.vx) + 8;
      ball.vy = hitPos * 14;

      createExplosion(ball.x, ball.y, "#ffffff");
      createExplosion(ball.x, ball.y, "#ff00ff");

      shake = 18;

      smashActive = false;

    } else {

      ball.vx = Math.abs(ball.vx) + 0.25;
      ball.vy = hitPos * 8;

      createExplosion(ball.x, ball.y, "#ff00ff");

      shake = 9;

    }

    ball.x = player.x + player.w + ball.r;

  }

  if (
    collision(ball, bot) &&
    ball.vx > 0
  ) {

    let hitPos =
      (ball.y - (bot.y + bot.h / 2))
      / (bot.h / 2);

    if (botSmashActive) {

      ball.vx = -Math.abs(ball.vx) - 8;
      ball.vy = hitPos * 14;

      createExplosion(ball.x, ball.y, "#ffffff");
      createExplosion(ball.x, ball.y, "#39ff14");

      shake = 18;

      botSmashActive = false;
      botSmashCooldown = 240;

    } else {

      ball.vx = -Math.abs(ball.vx) - 0.25;
      ball.vy = hitPos * 8;

      createExplosion(ball.x, ball.y, "#39ff14");

      shake = 9;

    }

    ball.x = bot.x - ball.r;

  }

  if (ball.x < 0) {
    bot.score++;
    resetBall();
  }

  if (ball.x > canvas.width) {
    player.score++;
    resetBall();
  }

  if (player.score >= WIN_SCORE) {
    winner = "PLAYER WINS";
    gameState = "gameover";
  }

  if (bot.score >= WIN_SCORE) {
    winner = "BOT WINS";
    gameState = "gameover";
  }

  updateParticles();

  if (shake > 0) shake--;

}

function renderGame() {

  ctx.fillStyle = "#050510";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  let dx = 0;
  let dy = 0;

  if (shake > 0) {
    dx = (Math.random() - 0.5) * shake;
    dy = (Math.random() - 0.5) * shake;
  }

  ctx.save();

  ctx.translate(dx, dy);

  drawCenterLine();

  drawTrail();

  drawParticles();

  drawPaddle(
    player,
    smashActive ? "#ffffff" : "#ff00ff"
  );

  drawPaddle(
    bot,
    botSmashActive ? "#ffffff" : "#39ff14"
  );

  drawBall();

  ctx.fillStyle = "white";

  ctx.font = "48px Arial";

  ctx.fillText(
    player.score,
    canvas.width / 2 - 100,
    60
  );

  ctx.fillText(
    bot.score,
    canvas.width / 2 + 70,
    60
  );

  ctx.restore();

}

function render() {

  if (gameState === "menu") {
    drawMenuScreen();
    return;
  }

  if (gameState === "gameover") {
    drawEndScreen();
    return;
  }

  renderGame();

}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

resize();
resetBall();
loop();
</script>

</body>
</html>

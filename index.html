<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Pong v1.2</title>

<style>

html, body {
  margin: 0;
  overflow: hidden;
  background: #050510;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  background:
    radial-gradient(circle at center, #111 0%, #050510 70%);
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  bot.x = canvas.width - 40;
}

window.addEventListener("resize", resize);

let started = false;
let paused = false;
let gameOver = false;
let winner = "";

const WIN_SCORE = 5;

let screenShake = 0;


const player = {
  x: 20,
  y: 200,
  w: 12,
  h: 120,
  score: 0
};

const bot = {
  x: 0,
  y: 200,
  w: 12,
  h: 120,
  score: 0
};

const ball = {
  x: 300,
  y: 300,
  r: 10,
  vx: 7,
  vy: 4,
  speed: 7
};


const particles = [];
const trail = [];


resize();

resetBall();

window.addEventListener("mousemove", e => {
  player.y = e.clientY - player.h / 2;
});

window.addEventListener("keydown", e => {

  if (e.code === "Space") {

    if (gameOver) {
      resetGame();
    }

    started = true;
  }

  if (e.key.toLowerCase() === "p") {
    paused = !paused;
  }

});


function resetBall() {

  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;

  ball.speed = 7;

  ball.vx = Math.random() > 0.5 ? 7 : -7;
  ball.vy = (Math.random() - 0.5) * 6;
}

function resetGame() {

  player.score = 0;
  bot.score = 0;

  gameOver = false;
  winner = "";

  resetBall();
}


function createExplosion(x, y, color) {

  for (let i = 0; i < 20; i++) {

    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 1,
      color
    });

  }
}

function updateParticles() {

  for (let i = particles.length - 1; i >= 0; i--) {

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.life -= 0.02;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {

  particles.forEach(p => {

    ctx.save();

    ctx.globalAlpha = p.life;

    ctx.fillStyle = p.color;
    ctx.shadowBlur = 20;
    ctx.shadowColor = p.color;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

  });

}


function drawPaddle(paddle, color) {

  ctx.save();

  ctx.fillStyle = color;

  ctx.shadowBlur = 25;
  ctx.shadowColor = color;

  ctx.fillRect(
    paddle.x,
    paddle.y,
    paddle.w,
    paddle.h
  );

  ctx.restore();
}

function drawBall() {

  ctx.save();

  ctx.fillStyle = "#00e5ff";

  ctx.shadowBlur = 30;
  ctx.shadowColor = "#00e5ff";

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawTrail() {

  for (let i = 0; i < trail.length; i++) {

    const t = trail[i];

    ctx.save();

    ctx.globalAlpha = i / trail.length;

    ctx.fillStyle = "#00e5ff";

    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

  }
}


function collision(ball, paddle) {

  return (
    ball.x - ball.r < paddle.x + paddle.w &&
    ball.x + ball.r > paddle.x &&
    ball.y - ball.r < paddle.y + paddle.h &&
    ball.y + ball.r > paddle.y
  );

}


function update() {

  if (!started || paused || gameOver) return;



  ball.x += ball.vx;
  ball.y += ball.vy;


  trail.push({
    x: ball.x,
    y: ball.y
  });

  if (trail.length > 20) {
    trail.shift();
  }


  if (
    ball.y < ball.r ||
    ball.y > canvas.height - ball.r
  ) {
    ball.vy *= -1;

    createExplosion(ball.x, ball.y, "#00e5ff");
    screenShake = 10;
  }


  bot.y += (
    ball.y - (bot.y + bot.h / 2)
  ) * 0.08;

  if (collision(ball, player)) {

    let hitPos =
      (ball.y - (player.y + player.h / 2))
      / (player.h / 2);

    ball.vx = Math.abs(ball.vx) + 0.3;
    ball.vy = hitPos * 8;

    createExplosion(ball.x, ball.y, "#ff00ff");

    screenShake = 10;
  }


  if (collision(ball, bot)) {

    let hitPos =
      (ball.y - (bot.y + bot.h / 2))
      / (bot.h / 2);

    ball.vx = -Math.abs(ball.vx) - 0.3;
    ball.vy = hitPos * 8;

    createExplosion(ball.x, ball.y, "#39ff14");

    screenShake = 10;
  }


  if (ball.x < 0) {

    bot.score++;
    resetBall();

  }

  if (ball.x > canvas.width) {

    player.score++;
    resetBall();

  }

  if (player.score >= WIN_SCORE) {
    gameOver = true;
    winner = "PLAYER WINS";
  }

  if (bot.score >= WIN_SCORE) {
    gameOver = true;
    winner = "BOT WINS";
  }

  updateParticles();

  if (screenShake > 0) {
    screenShake--;
  }

}
  
function render() {

  let dx = 0;
  let dy = 0;

  if (screenShake > 0) {

    dx = (Math.random() - 0.5) * screenShake;
    dy = (Math.random() - 0.5) * screenShake;

  }

  ctx.save();

  ctx.translate(dx, dy);


  ctx.fillStyle = "rgba(5,5,16,0.25)";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.setLineDash([10, 15]);

  ctx.beginPath();

  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);

  ctx.stroke();


  drawTrail();

  drawParticles();


  drawPaddle(player, "#ff00ff");
  drawPaddle(bot, "#39ff14");


  drawBall();

  ctx.fillStyle = "white";
  ctx.font = "48px Arial";

  ctx.fillText(
    player.score,
    canvas.width / 2 - 100,
    60
  );

  ctx.fillText(
    bot.score,
    canvas.width / 2 + 70,
    60
  );


  if (!started) {

    ctx.fillStyle = "white";
    ctx.font = "40px Arial";

    ctx.fillText(
      "PRESS SPACE TO START",
      canvas.width / 2 - 250,
      canvas.height / 2
    );

  }

  // PAUSED

  if (paused) {

    ctx.fillStyle = "white";
    ctx.font = "50px Arial";

    ctx.fillText(
      "PAUSED",
      canvas.width / 2 - 100,
      canvas.height / 2
    );

  }


  if (gameOver) {

    ctx.fillStyle = "white";
    ctx.font = "60px Arial";

    ctx.fillText(
      winner,
      canvas.width / 2 - 220,
      canvas.height / 2
    );

    ctx.font = "30px Arial";

    ctx.fillText(
      "PRESS SPACE TO RESTART",
      canvas.width / 2 - 210,
      canvas.height / 2 + 60
    );

  }

  ctx.restore();

}


function loop() {

  update();
  render();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
